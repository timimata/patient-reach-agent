[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "llm: calls a real LLM API; opt-in with --llm PROVIDER (costs credits)",
]
filterwarnings = [
    # Raised inside Starlette's test client (a dependency), not by this project's code.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
